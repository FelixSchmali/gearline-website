name: Update stock from JTL-FFN

on:
  schedule:
    - cron: '0 5 * * *' # daily, 05:00 UTC (~7am Europe/Berlin)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stock from JTL-FFN and update products.json
        env:
          JTL_CLIENT_ID: ${{ secrets.JTL_CLIENT_ID }}
          JTL_CLIENT_SECRET: ${{ secrets.JTL_CLIENT_SECRET }}
          JTL_REFRESH_TOKEN: ${{ secrets.JTL_REFRESH_TOKEN }}
        run: node scripts/update-stock.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "gearline-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- products.json; then
            git add products.json
            git commit -m "Auto-update stock from JTL-FFN"
            git push
          else
            echo "No changes to commit."
          fi
